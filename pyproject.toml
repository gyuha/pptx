[project]
name = "pptx-agent"
version = "0.1.0"
description = "Local MVP PDF-to-PPTX agent scaffold"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "PyMuPDF==1.24.13",
  "pdfplumber==0.11.4",
  "pypdf==5.1.0",
  "python-pptx==1.0.2",
  "pydantic==2.11.7",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"
